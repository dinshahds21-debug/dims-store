<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dims Store | Beranda</title>
    <style>
     
.floating-settings {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #2c3e50;
    color: white;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 24px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    z-index: 1000;
}
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f4f4f4; }
        header { background: #2c3e50; color: white; padding: 15px; text-align: center; }
        
        /* Search Bar Shopee Style */
        .search-container { background: #ee4d2d; padding: 20px; text-align: center; }
        .search-container input { width: 70%; padding: 12px; border-radius: 5px; border: none; font-size: 16px; outline: none; }

        .container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
            gap: 20px; padding: 30px; 
        }

        .card { 
            background: white; border-radius: 8px; overflow: hidden; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: relative; transition: 0.3s;
        }
        .card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-info { padding: 15px; text-align: center; }
        .owner-badge { position: absolute; background: rgba(0,0,0,0.6); color: white; padding: 4px 8px; font-size: 11px; border-radius: 0 0 5px 0; }
        
        button { cursor: pointer; border: none; border-radius: 5px; font-weight: bold; }
        .btn-tambah-baru { background: #27ae60; color: white; padding: 10px 20px; margin: 20px; }
        .btn-buy { background: #ee4d2d; color: white; width: 100%; padding: 10px; margin-top: 5px; }
        .btn-hapus { background: #e74c3c; color: white; padding: 8px; width: 100%; margin-top: 5px; }

        /* Modal Style */
        #modal-tambah { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.8); z-index: 9999; justify-content: center; align-items: center; 
        }
        .modal-content { background: white; padding: 25px; border-radius: 10px; width: 300px; }
        .modal-content input { width: 90%; padding: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>

<header>
    <h1>Dims Store</h1>
</header>

<div class="search-container">
    <input type="text" id="search-input" onkeyup="cariProduk()" placeholder="Cari produk atau nama penjual...">
</div>

<button class="btn-tambah-baru" onclick="bukaModalTambah()">+ Tambah Produk Baru</button>

<div id="product-list" class="container"></div>

<div id="modal-tambah">
    <div class="modal-content">
        <h3>Tambah Produk</h3>
        <input type="text" id="add-name" placeholder="Nama Barang">
        <input type="number" id="add-price" placeholder="Harga (Rp)">
        <input type="file" id="add-file" accept="image/*">
        <button onclick="simpanProdukBaru()" style="background:#27ae60; color:white; width:100%; padding:10px; margin-bottom:5px;">Posting</button>
        <button onclick="tutupModalTambah()" style="background:#ccc; width:100%; padding:10px;">Batal</button>
    </div>
</div>

<script>
    function toggleSettings() {
    const menu = document.getElementById('settings-menu');
    menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
}

function logout() {
    localStorage.removeItem('currentUser');
    window.location.href = "login.html";
}
    // 1. Data Produk (Ambil dari LocalStorage atau pakai data awal)
    let products = JSON.parse(localStorage.getItem('myProducts')) || [
        { name: "Mounting Beat Karbu 6cm", price: 285000, img: "https://via.placeholder.com/200", owner: "Admin" },
        { name: "Knalpot ARM Luster V2", price: 2400000, img: "https://via.placeholder.com/200", owner: "Admin" }
    ];

    const currentUser = localStorage.getItem('currentUser') || "Guest";

    // 2. Fungsi Render (Menampilkan Barang)
    function render(filterText = "") {
        const list = document.getElementById('product-list');
        list.innerHTML = '';

        const filtered = products.filter(p => {
            return p.name.toLowerCase().includes(filterText.toLowerCase()) || 
                   p.owner.toLowerCase().includes(filterText.toLowerCase());
        });

        filtered.forEach((p, i) => {
            const isMyProduct = (p.owner === currentUser);
            list.innerHTML += `
                <div class="card">
                    <div class="owner-badge">👤 ${p.owner}</div>
                    <img src="${p.img}">
                    <div class="card-info">
                        <h3>${p.name}</h3>
                        <p style="color:#e67e22; font-weight:bold;">Rp ${p.price.toLocaleString()}</p>
                        ${isMyProduct ? 
                            `<button class="btn-hapus" onclick="hapusProduk(${i})">Hapus Produk Saya</button>` : 
                            `<button class="btn-buy" onclick="alert('Masuk Keranjang!')">Tambah ke Keranjang</button>`
                        }
                    </div>
                </div>`;
        });
    }

    // 3. Fungsi Pencarian
    function cariProduk() {
        const teks = document.getElementById('search-input').value;
        render(teks);
    }

    // 4. Fungsi Modal
    function bukaModalTambah() { document.getElementById('modal-tambah').style.display = 'flex'; }
    function tutupModalTambah() { document.getElementById('modal-tambah').style.display = 'none'; }

    // 5. Simpan Produk Baru
    function simpanProdukBaru() {
        const nama = document.getElementById('add-name').value;
        const harga = document.getElementById('add-price').value;
        const fileInput = document.getElementById('add-file');
        const file = fileInput.files[0];

        if (!nama || !harga || !file) return alert("Isi semua data!");

        const reader = new FileReader();
        reader.onloadend = function() {
            const baru = { name: nama, price: parseInt(harga), img: reader.result, owner: currentUser };
            products.push(baru);
            localStorage.setItem('myProducts', JSON.stringify(products));
            render();
            tutupModalTambah();
        }
        reader.readAsDataURL(file);
    }

    // 6. Hapus Produk
    function hapusProduk(index) {
        if (confirm("Hapus barang ini?")) {
            products.splice(index, 1);
            localStorage.setItem('myProducts', JSON.stringify(products));
            render();
        }
    }

    // Jalankan render pertama kali
    render();
</script>
<div class="floating-settings" onclick="toggleSettings()">⚙️</div>

<div id="settings-menu" style="display:none; position:fixed; bottom:90px; right:20px; background:white; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.2); padding:10px; z-index:1001;">
    <button onclick="logout()" style="background:#e74c3c; color:white; padding:10px; border:none; border-radius:5px; width:100%;">Keluar / Ganti Akun</button>
</div>
</body>
</html>
